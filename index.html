<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LingoPet Companion</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23FDBA74'/%3E%3Ccircle cx='24' cy='26' r='4' fill='%231F2937'/%3E%3Ccircle cx='40' cy='26' r='4' fill='%231F2937'/%3E%3Cpath d='M20 40c3 6 21 6 24 0' stroke='%231F2937' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* Custom scrollbar for cleanliness */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e5e7eb;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d1d5db;
      }

      /* Dot pattern background */
      .bg-dot-pattern {
        background-image: radial-gradient(#E5E7EB 1px, transparent 1px);
        background-size: 20px 20px;
      }

      /* Glassmorphism utility */
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      /* Handwriting font for quotes */
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap');

      .font-handwriting {
        font-family: 'Caveat', cursive;
      }
    </style>
  </head>
  <body class="bg-brand-50 text-gray-800 font-sans antialiased min-h-screen selection:bg-brand-200 bg-dot-pattern">
    <div id="root" class="w-full"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>

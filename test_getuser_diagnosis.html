<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Auth Diagnosis</title>
    <style>
        body {
            font-family: monospace;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .log-entry {
            margin: 5px 0;
            padding: 8px;
            border-left: 3px solid #ccc;
            background: white;
            border-radius: 3px;
        }
        .log-info { border-color: #2196F3; }
        .log-success { border-color: #4CAF50; background: #e8f5e9; }
        .log-error { border-color: #f44336; background: #ffebee; }
        .log-warning { border-color: #ff9800; }
        .timestamp { color: #666; font-size: 0.9em; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover { background: #1976D2; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Supabase Auth Diagnosis Tool</h1>
    <p>This tool tests the authentication flow to identify hang issues.</p>

    <div>
        <button id="testDirect" onclick="testDirectGetUser()">Test Direct getUser()</button>
        <button id="testTimeout" onclick="testTimeoutGetUser()">Test with Timeout</button>
        <button id="testRetry" onclick="testRetryGetUser()">Test with Retry</button>
        <button id="testGetSession" onclick="testGetSession()">Test getSession()</button>
        <button id="clear" onclick="clearLogs()">Clear Logs</button>
    </div>

    <div id="logs"></div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://qwfxyeomymybjcxnbwdg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3Znh5ZW9teW15YmpjeG5id2RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwMTIwNDksImV4cCI6MjA4NTU4ODA0OX0.T5aDxVkuQTw2HmmA_8tQ7NSuVtBHSzNmPPnIVdUpph0';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
            },
            global: {
                fetch: (url, options) => {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);
                    return fetch(url, { ...options, signal: controller.signal })
                        .finally(() => clearTimeout(timeoutId));
                }
            }
        });

        const logsDiv = document.getElementById('logs');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="timestamp">[${time}]</span> ${message}`;
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}]`, message);
        }

        window.clearLogs = () => {
            logsDiv.innerHTML = '';
            log('Logs cleared', 'info');
        };

        window.testDirectGetUser = async () => {
            log('--- Testing Direct getUser() ---', 'info');
            const start = Date.now();
            try {
                log('Calling supabase.auth.getUser()...', 'info');
                const result = await supabase.auth.getUser();
                const elapsed = Date.now() - start;
                log(`getUser() completed in ${elapsed}ms`, result.data.user ? 'success' : 'warning');
                log(`User: ${result.data.user ? JSON.stringify(result.data.user) : 'None'}`, 'info');
            } catch (error) {
                const elapsed = Date.now() - start;
                log(`getUser() failed after ${elapsed}ms: ${error.message}`, 'error');
            }
        };

        window.testTimeoutGetUser = async () => {
            log('--- Testing getUser() with 5s Timeout ---', 'info');
            const start = Date.now();
            try {
                log('Calling supabase.auth.getUser() with 5s timeout...', 'info');
                const result = await Promise.race([
                    supabase.auth.getUser(),
                    new Promise((_, reject) =>
                        setTimeout(() => reject(new Error('getUser timeout after 5000ms')), 5000)
                    )
                ]);
                const elapsed = Date.now() - start;
                log(`getUser() completed in ${elapsed}ms`, result.data.user ? 'success' : 'warning');
                log(`User: ${result.data.user ? JSON.stringify(result.data.user) : 'None'}`, 'info');
            } catch (error) {
                const elapsed = Date.now() - start;
                log(`getUser() failed after ${elapsed}ms: ${error.message}`, 'error');
            }
        };

        window.testRetryGetUser = async () => {
            log('--- Testing getUser() with Retry (2 attempts, 5s each) ---', 'info');
            const start = Date.now();
            const maxRetries = 2;

            for (let i = 0; i < maxRetries; i++) {
                const attemptStart = Date.now();
                try {
                    log(`Attempt ${i + 1}/${maxRetries} calling supabase.auth.getUser()...`, 'info');
                    const result = await Promise.race([
                        supabase.auth.getUser(),
                        new Promise((_, reject) =>
                            setTimeout(() => reject(new Error(`getUser timeout after 5000ms on attempt ${i + 1}`)), 5000)
                        )
                    ]);
                    const elapsed = Date.now() - attemptStart;
                    log(`Attempt ${i + 1} completed in ${elapsed}ms`, result.data.user ? 'success' : 'warning');

                    if (result.data.user) {
                        const totalElapsed = Date.now() - start;
                        log(`Total time: ${totalElapsed}ms. User found!`, 'success');
                        log(`User: ${JSON.stringify(result.data.user)}`, 'info');
                        return result;
                    }

                    if (i < maxRetries - 1) {
                        const delay = 1000 * (i + 1);
                        log(`No user found, waiting ${delay}ms before retry...`, 'warning');
                        await new Promise(r => setTimeout(r, delay));
                    }
                } catch (error) {
                    const elapsed = Date.now() - attemptStart;
                    log(`Attempt ${i + 1} failed after ${elapsed}ms: ${error.message}`, 'error');
                    if (i === maxRetries - 1) {
                        const totalElapsed = Date.now() - start;
                        log(`All retries failed after ${totalElapsed}ms`, 'error');
                        throw error;
                    }
                }
            }
        };

        window.testGetSession = async () => {
            log('--- Testing getSession() ---', 'info');
            const start = Date.now();
            try {
                log('Calling supabase.auth.getSession()...', 'info');
                const result = await supabase.auth.getSession();
                const elapsed = Date.now() - start;
                log(`getSession() completed in ${elapsed}ms`, result.data.session ? 'success' : 'warning');
                log(`Session: ${result.data.session ? JSON.stringify(result.data.session) : 'None'}`, 'info');
            } catch (error) {
                const elapsed = Date.now() - start;
                log(`getSession() failed after ${elapsed}ms: ${error.message}`, 'error');
            }
        };

        // Initial check
        log('Supabase client initialized', 'info');
        log('URL: ' + SUPABASE_URL, 'info');
        log('Note: This page uses the same configuration as LingoPet', 'info');
    </script>
</body>
</html>
